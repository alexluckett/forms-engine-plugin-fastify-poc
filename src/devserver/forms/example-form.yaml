# Example V2 form for the devserver. Pages run in order; a page with a
# condition is shown only when the condition is true.
engine: V2
schema: 2
name: Example form
sections: []
lists:
  - id: 0b8d4c4e-6f7a-4e31-9a2b-7c1d2e3f4a01
    name: yesNo
    title: Yes or no
    type: string
    items:
      - id: 0b8d4c4e-6f7a-4e31-9a2b-7c1d2e3f4a02
        text: 'Yes'
        value: 'yes'
      - id: 0b8d4c4e-6f7a-4e31-9a2b-7c1d2e3f4a03
        text: 'No'
        value: 'no'
  - id: 0b8d4c4e-6f7a-4e31-9a2b-7c1d2e3f4a04
    name: petTypes
    title: Pet types
    type: string
    items:
      - id: 0b8d4c4e-6f7a-4e31-9a2b-7c1d2e3f4a05
        text: Cat
        value: cat
      - id: 0b8d4c4e-6f7a-4e31-9a2b-7c1d2e3f4a06
        text: Dog
        value: dog
      - id: 0b8d4c4e-6f7a-4e31-9a2b-7c1d2e3f4a07
        text: Fish
        value: fish
conditions:
  - id: 0b8d4c4e-6f7a-4e31-9a2b-7c1d2e3f4b01
    displayName: Has a pet
    items:
      - id: 0b8d4c4e-6f7a-4e31-9a2b-7c1d2e3f4b02
        componentId: 0b8d4c4e-6f7a-4e31-9a2b-7c1d2e3f4c03
        operator: is
        type: ListItemRef
        value:
          listId: 0b8d4c4e-6f7a-4e31-9a2b-7c1d2e3f4a01
          itemId:
            - 0b8d4c4e-6f7a-4e31-9a2b-7c1d2e3f4a02
  - id: 0b8d4c4e-6f7a-4e31-9a2b-7c1d2e3f4b03
    displayName: Over 65
    items:
      - id: 0b8d4c4e-6f7a-4e31-9a2b-7c1d2e3f4b04
        componentId: 0b8d4c4e-6f7a-4e31-9a2b-7c1d2e3f4c02
        operator: is more than
        type: NumberValue
        value: 65
pages:
  - path: /your-name
    title: Your name
    components:
      - id: 0b8d4c4e-6f7a-4e31-9a2b-7c1d2e3f4c01
        type: TextField
        name: fullName
        title: What is your full name?
        schema:
          max: 100
  - path: /contact
    title: Your contact details
    components:
      - type: EmailAddressField
        name: email
        title: Email address
        hint: We will only use this to send you a copy of your answers
      - id: 0b8d4c4e-6f7a-4e31-9a2b-7c1d2e3f4c02
        type: NumberField
        name: age
        title: Your age
        schema:
          min: 18
          max: 120
  - path: /has-pet
    title: Pets
    components:
      - id: 0b8d4c4e-6f7a-4e31-9a2b-7c1d2e3f4c03
        type: RadiosField
        name: hasPet
        title: Do you have a pet?
        list: 0b8d4c4e-6f7a-4e31-9a2b-7c1d2e3f4a01
  - path: /pet-details
    title: About your pets
    condition: 0b8d4c4e-6f7a-4e31-9a2b-7c1d2e3f4b01
    components:
      - type: CheckboxesField
        name: petTypes
        title: Pet types
        hint: Select all that apply
        list: 0b8d4c4e-6f7a-4e31-9a2b-7c1d2e3f4a04
      - type: DatePartsField
        name: petBirthday
        title: When was your oldest pet born?
        hint: For example, 27 3 2019
  - path: /retirement
    title: Retirement
    condition: 0b8d4c4e-6f7a-4e31-9a2b-7c1d2e3f4b03
    components:
      - type: TextField
        name: retirementPlans
        title: What are your retirement plans?
        options:
          required: false
  - path: /summary
    title: Check your answers before sending your form
    controller: SummaryPageController
